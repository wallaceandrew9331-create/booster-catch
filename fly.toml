# Fly.io config for the optional leaderboard server (not deployed yet).
#   fly launch --no-deploy --copy-config
#   fly volumes create bc_data --size 1
#   fly secrets set CORS_ORIGIN=https://<you>.github.io
#   fly deploy
app = "booster-catch-leaderboard"
primary_region = "dfw"

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  PORT = "8787"
  DB_PATH = "/data/booster-catch.db"
  TRUST_PROXY = "1"

[mounts]
  source = "bc_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
